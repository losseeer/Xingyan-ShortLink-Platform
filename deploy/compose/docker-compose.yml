name: xsl

# 容器网络内的中间件地址（宿主默认值写在各自 application.yml 的 ${VAR:default} 里）。
# 四个应用共用同一份环境变量命名空间：每个服务只读自己用到的键，多余注入不影响行为，
# 换来的是 compose 里少四处近似重复、且 `make demo` 一条 env 改址即可整体迁移。
# 口令一律从 deploy/compose/.env 注入（该文件不入库，模板见 .env.example）：
# compose 在项目目录（= 本文件所在目录）自动读 .env，`:?` 让缺失时立刻报错而不是带空串起栈。
x-app-env: &app-env
  XSL_MYSQL_HOST: mysql
  XSL_MYSQL_PORT: "3306"
  XSL_MYSQL_USER: root
  XSL_MYSQL_PASSWORD: ${XSL_MYSQL_PASSWORD:?缺少 XSL_MYSQL_PASSWORD，请 cp deploy/compose/.env.example deploy/compose/.env}
  XSL_REDIS_HOST: redis
  XSL_REDIS_PORT: "6379"
  XSL_KAFKA_BOOTSTRAP: kafka:9092
  XSL_CH_URL: http://clickhouse:8123/
  XSL_CH_USER: xsl_app
  XSL_CH_PASSWORD: ${XSL_CH_PASSWORD:?缺少 XSL_CH_PASSWORD，请见 deploy/compose/.env.example}

services:

  mysql:
    image: mysql:8.4
    # 宿主机 Homebrew mysqld 占用 127.0.0.1:3306（IPv4 回环优先于 Docker 的 *:3306），
    # 故宿主侧走 3307；容器网络内其他服务仍用 mysql:3306。
    ports: ["3307:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: ${XSL_MYSQL_PASSWORD:?缺少 XSL_MYSQL_PASSWORD，见 deploy/compose/.env.example}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init/mysql:/docker-entrypoint-initdb.d:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_bin
    healthcheck:
      # 口令从容器自己的 env 取（MYSQL_ROOT_PASSWORD），命令行与文件里都不落明文
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    # 本机 Homebrew redis-server 占用 127.0.0.1:6379（与 mysqld 抢 3306 同类），
    # 宿主侧直连走 6380；容器网络内其他服务仍用 redis:6379。
    ports: ["6380:6379"]
    mem_limit: 512m
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 10

  kafka:
    image: apache/kafka:3.8.1
    ports: ["9094:9094"]
    mem_limit: 1g
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 双 listener：容器网络内 kafka:9092，宿主机 localhost:9094（KRaft 单节点）
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # M2-22：1 分区把 consumer 的并行度硬顶在 1（Kafka 的并发单位是分区）。4 分区对正确性无影响：
  # producer 以 short_code 为 key，同一码仍落同一分区、码内顺序不变，跨码之间本无顺序语义；
  # 重复投递仍由 event_id + ReplacingMergeTree 消化（DESIGN 8.4）。
  # 分区"只增不减"与幂等判断都放进 ensure-topic.sh —— 直接串一条 `--alter --partitions`
  # 会在已达标时退出 1，而这个一次性容器是 consumer 的 service_completed_successfully 前置条件。
  kafka-init:
    image: apache/kafka:3.8.1
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./init/kafka/ensure-topic.sh:/ensure-topic.sh:ro
    environment:
      TOPIC: shortlink-click
      PARTITIONS: "4"
      REPLICAS: "1"
    entrypoint: ["/bin/sh", "/ensure-topic.sh"]
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    ports: ["8123:8123", "9000:9000"]
    mem_limit: 2g
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./init/clickhouse:/docker-entrypoint-initdb.d:ro
      # 给容器内 default 用户开 access_management，否则 `make ch-init` 的 CREATE/GRANT 会被拒
      - ./init/clickhouse/users.d/local-admin.xml:/etc/clickhouse-server/users.d/local-admin.xml:ro
      # BACKUP/RESTORE 的路径白名单：不开则 `make backup` 第一步就写不出文件（DESIGN 8.3 第六行，M3-09）
      - ./init/clickhouse/config.d/backups.xml:/etc/clickhouse-server/config.d/backups.xml:ro
      # 应用账号 xsl_app 不写进 users.d XML —— 那种文件只能落明文口令，一入库就等于泄露。
      # 改由 `make ch-init`（scripts/init-ch-user.sh）用 CREATE/ALTER USER + GRANT 建号，
      # 口令运行时从 deploy/compose/.env 经 SQL 进容器；全新卷与已有卷走同一条路径。
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ===================== 应用面（M1-10）=====================
  # 镜像由 scripts/build-images.sh 产出（宿主 mvn package → COPY jar），compose 只消费 tag；
  # 需要 rebuild 时：make images（见 Makefile）。

  gateway:
    image: xsl/gateway:dev
    mem_limit: 512m
    restart: always
    environment:
      <<: *app-env
      SERVER_PORT: "8010"  # Spring Boot 宽松绑定：env 优先于 yml 的 server.port
      XSL_ADMIN_HOST: admin
      XSL_ADMIN_PORT: "8030"
    ports: ["8110:8010"]  # 宿主 8010 已被本机其他项目占用，故映射 8110
    depends_on:
      redis: {condition: service_healthy}
    healthcheck: &http-health
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${SERVER_PORT}/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  admin:
    image: xsl/admin:dev
    mem_limit: 640m
    restart: always
    environment:
      <<: *app-env
      SERVER_PORT: "8030"
      # outbox 补偿任务的开关要能"改一个环境变量就生效"，否则它只存在于宿主机的 java -jar 里
      # （M2-33 那个 mode 假开关的同一课，见 ITER-M2 §4）。
      XSL_OUTBOX_SYNC: ${XSL_OUTBOX_SYNC:-true}
      XSL_OUTBOX_SYNC_INTERVAL: ${XSL_OUTBOX_SYNC_INTERVAL:-5000}
    ports: ["8030:8030"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      <<: *http-health

  # 数据面多实例（DESIGN 3.3「单机 ≠ 单实例」）：两个显式服务而非 --scale，
  # 因为 nginx upstream 需要稳定的容器 DNS 名，且验收要 `docker kill xsl-jump-1` 按名逐个摘除。
  jump-1:
    image: xsl/jump:dev
    # 512m 是 Docker VM 只有 3.9G 时收出来的值；实测 jump 常驻 473–509MiB 长期贴顶，
    # 有被 OOM-kill 的风险。VM 提到 8G 后按 DESIGN 3.3 的口径给 768m（堆 = 55% ≈ 422M）。
    # 注意：这消除的是稳定性隐患，M1-11/M2-00 两轮都证明它对 P99 无改善（见 ITER-M2 §4）。
    mem_limit: 768m
    restart: always
    environment:
      <<: *app-env
      SERVER_PORT: "8020"
      XSL_INSTANCE: jump-1
      XSL_JUMP_WAL_DIR: /app/data/wal
      # 跳转形态与 URL Link provider 要能"改一个环境变量就切回去"（DESIGN 6.2 的真开关）。
      # 不透传的话，application.yml 里的 ${XSL_JUMP_MODE:...} 永远只能看到默认值，
      # 开关等于只在宿主机 java -jar 时才存在——那不算支持。
      XSL_JUMP_MODE: ${XSL_JUMP_MODE:-dynamic}
      XSL_JUMP_URLLINK_PROVIDER: ${XSL_JUMP_URLLINK_PROVIDER:-mock}
    ports: ["8020:8020"]  # 宿主端口仅供直连调试；对外入口是 nginx :80
    volumes:
      - ./data/jump-wal/jump-1:/app/data/wal
    # 依赖刻意不含 kafka：数据面在事件通道不可达时必须继续 302（走 WAL，DESIGN 8.3）。
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      <<: *http-health

  jump-2:
    image: xsl/jump:dev
    mem_limit: 768m
    restart: always
    environment:
      <<: *app-env
      SERVER_PORT: "8020"
      XSL_INSTANCE: jump-2
      XSL_JUMP_WAL_DIR: /app/data/wal
      XSL_JUMP_MODE: ${XSL_JUMP_MODE:-dynamic}
      XSL_JUMP_URLLINK_PROVIDER: ${XSL_JUMP_URLLINK_PROVIDER:-mock}
    ports: ["8022:8020"]
    volumes:
      - ./data/jump-wal/jump-2:/app/data/wal
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      <<: *http-health

  consumer:
    image: xsl/consumer:dev
    mem_limit: 512m
    restart: always
    environment:
      <<: *app-env
      SERVER_PORT: "8040"
      # M2-22：并行度要在不重新构建镜像的前提下调档（A/B 三种并行度），所以走 compose 插值
      XSL_CONSUMER_CONCURRENCY: ${XSL_CONSUMER_CONCURRENCY:-4}
      # M3-03 归因回传：mock 宣发平台在 compose 网络内的地址 + 签名用的演示 key。
      XSL_PUSH_ENDPOINT: ${XSL_PUSH_ENDPOINT:-http://mock:8050/mock/attribution/batches}
      XSL_PUSH_API_KEY: ${XSL_PUSH_API_KEY:-xy-key-push-mock-001}
      XSL_PUSH_TENANT_ID: ${XSL_PUSH_TENANT_ID:-1001}
      # 这三个也要透传，否则 yml 里的 ${XSL_PUSH_ENABLED:...} 只能看到镜像构建时的默认值，
      # "改一个环境变量就关掉定时投递"就只存在于宿主机上（M2-33 那个假开关的同一课）。
      XSL_PUSH_ENABLED: ${XSL_PUSH_ENABLED:-true}
      XSL_PUSH_INTERVAL: ${XSL_PUSH_INTERVAL:-300000}
      XSL_PUSH_LOOKBACK: ${XSL_PUSH_LOOKBACK:-3}
    ports: ["8040:8040"]
    # 依赖 kafka-init「成功退出」而不只是 kafka「健康」：topic 不存在时 spring-kafka 容器
    # 启动即抛 ConfigException 并 crash-loop（Docker 重启后必现，本机实测 consumer Restarting）。
    # 一次性容器用 service_completed_successfully 表达，正好也把 --wait 的语义对齐成"已完成"。
    # 依赖里没有 mock：外部宣发平台挂了不该拖住事件消费者（回传是尽力而为的投递，
    # 下一轮同内容算出同一个 batch_id 重投即可，见 DESIGN 6.3-3）。
    depends_on:
      kafka: {condition: service_healthy}
      kafka-init: {condition: service_completed_successfully}
      clickhouse: {condition: service_healthy}
    healthcheck:
      <<: *http-health

  # mock 宣发平台（M3-03 起从占位目录变成真模块）。身份是"外部系统"：
  # 不挂 nginx 对外路由、不经网关、独立库 xsl_mock，只从 compose 内网接收归因回传；
  # 宿主 8050 是给验收/对账脚本取数用的。
  mock:
    image: xsl/mock:dev
    mem_limit: 256m
    restart: always
    environment:
      <<: *app-env
      SERVER_PORT: "8050"
      XSL_MOCK_PUSH_KEY: ${XSL_PUSH_API_KEY:-xy-key-push-mock-001}
      XSL_MOCK_TENANT: ${XSL_PUSH_TENANT_ID:-1001}
    ports: ["8050:8050"]
    depends_on:
      mysql: {condition: service_healthy}
    healthcheck:
      <<: *http-health

  nginx:
    image: nginx:1.27-alpine
    # 8081 = 主办方看板的静态站 + 同源反代（M3-06，conf.d/40-console.conf）。
    # 不并到 80：80 上 xy*.test 的 / 已经是数据面的裸短码入口，看板抢不到那个前缀。
    ports: ["80:80", "443:443", "8081:8081"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # mock 购票页的静态件与本地自签证书（M2-34）。tls/ 不入库，由 `make tls` 生成 ——
      # 目录不存在时 Docker 会替我们建一个空目录，nginx 就以 "cannot load certificate" 起不来，
      # 所以 Makefile 的 up 目标把 tls 做成前置依赖，而不是让人去读这段报错。
      - ./nginx/html:/etc/nginx/html:ro
      - ./tls:/etc/nginx/tls:ro
      # 看板构建产物（dist/ 不入库，`make web` 现场生成）。这里空目录的后果比 tls 温和——
      # nginx 照样起得来，只是所有路径都 404，看起来像"前端坏了"；所以 up 也把它做成前置检查。
      - ../../sl-console-web/dist:/etc/nginx/console:ro
    # service_started 而非 healthy：nginx 只在启动时解析 upstream 容器名，
    # 要求「已创建」即可；若配 healthy，则验收中 kill 掉 jump-1 后 nginx 无法重启。
    depends_on:
      gateway: {condition: service_started}
      admin: {condition: service_started}
      jump-1: {condition: service_started}
      jump-2: {condition: service_started}
      consumer: {condition: service_started}
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---- 可选：--profile observability（DESIGN 8.5，单机告警用 cron 查 PromQL 等价实现）----
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["observability"]
    ports: ["9090:9090"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["observability"]
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?缺少 GRAFANA_PASSWORD，见 deploy/compose/.env.example}

  # ---- 可选：--profile redis-ha（主从复制 + Sentinel 故障转移语义演示，M2 后启用）----
  # 1 主 2 从 + 3 Sentinel，全部同宿主机，仅演示语义（DESIGN 3.3 诚实口径），暂为占位。

volumes:
  mysql-data:
  redis-data:
  kafka-data:
  clickhouse-data:
