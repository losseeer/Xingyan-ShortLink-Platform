# M1-10 网关与多域名路由（DESIGN 3.3 拓扑 / 5.4 入口形态 / 10.2 域名池本地验证）
#
# 三条硬规则：
#  1. 数据面（跳转）与管理面（API）在 nginx 这一层就分流：/s/** 与裸 /{code} 只碰 jump，
#     管理面（gateway→admin）整体宕机时存量短链照常 302 —— DESIGN 3.3 的核心架构表达点。
#  2. jump 是 upstream 轮询的两个实例（xsl-jump-1 / xsl-jump-2），不是单实例。
#  3. xy1/xy2/xy3 三个 server_name 指向同一组 location：code 与域名无绑定，跨域通用。

upstream xsl_jump {
    # 稳定容器名而非 --scale：验收要按名逐个 kill（见 ITER-M1 偏差记录）。
    # max_fails/fail_timeout：5s 内累计 3 次失败即临时摘除该实例，滚动重启期间不再投流量。
    server jump-1:8020 max_fails=3 fail_timeout=5s;
    server jump-2:8020 max_fails=3 fail_timeout=5s;
    keepalive 64;
}

# 控制面刻意不写 upstream 块，改用「变量 + Docker 内嵌 DNS 每 2s 重解析」：
# 容器 stop/start 后 IPAM 可能把地址重新分配（本机实测：gateway 与 admin 的地址互换），
# 静态 upstream 会一直连旧 IP 返回 502，除非人工 reload。管理面是单实例、不需要同请求改投，
# 用变量反代就能自愈。数据面反过来必须以静态 upstream 换取 LB + proxy_next_upstream。
resolver 127.0.0.11 valid=2s ipv6=off;

# 未登记的 Host：只留探活，其余直接掐断（域名白名单语义，DESIGN 10.2）
server {
    listen 80 default_server;
    server_name _;

    location = /healthz { return 200 "ok\n"; }
    location /          { return 444; }
}

server {
    listen 80;
    server_name xy1.test xy2.test xy3.test;

    # ---- 管理面：/api/** → gateway（HMAC 鉴权 + 限流）→ admin ----
    # 统计查询是读侧，落在 sl-consumer（DESIGN 6.4），故比 /api/ 更长前缀优先匹配。
    location /api/v1/stats/ {
        set $stats_upstream consumer;
        proxy_pass http://$stats_upstream:8040;
    }
    location /api/ {
        set $api_upstream gateway;
        proxy_pass http://$api_upstream:8010;
    }

    # ---- 数据面 ----
    location /s/ {
        proxy_pass http://xsl_jump;
    }
    # 裸 /{code} 形态（DESIGN 5.4）。跳转链路不需要 HTTP 保持以外的会话状态，实例可任意轮询。
    location / {
        proxy_pass http://xsl_jump;
    }
}
