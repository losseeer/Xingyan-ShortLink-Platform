# M2-34 mock 购票页（DESIGN 6.2「mock 购票页落地为 nginx 静态回显页」）
#
# 存在理由：短链 302 的终点是 https://mock.ticketsales.test/…，此前这个 Host 落到 default_server
# 被 444 掐断，演示里"跳转成功"之后浏览器只有 DNS 错误 —— 归因链路最后一公里看不见。
#
# 三条注意：
#  1. fragment（`#…`）不会上行到服务器，所以页面的 query/fragment 都由 mock-ticket.html 里的 JS 自己读；
#  2. 证书是本地自签（`make tls` 生成到 deploy/compose/tls/，不入库），浏览器会警告，手动继续即可；
#     这里不宣称"证书受信"。浏览器里真要看，宿主 hosts 需有 127.0.0.1  mock.ticketsales.test；
#  3. 未登记 Host 在 443 上同样按域名白名单语义掐断（default_server 只服务健康检查，见 DESIGN 9.5）。

server {
    listen 80;
    server_name mock.ticketsales.test;

    location = /healthz { return 200 "ok\n"; }
    # 任何路径都交给同一张回显页：302 的终点可能是 /show/1、/dl、/notice，页内 JS 负责回显差异。
    location / {
        root /etc/nginx/html;
        try_files /mock-ticket.html =404;
    }
}

# 443 的默认证书位由"未登记 Host"这一块持有：nginx 需要在 listener 上有一张证书才能握手，
# 握手后再按 server_name 决定给页面还是 444。
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/tls/mock.crt;
    ssl_certificate_key /etc/nginx/tls/mock.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location = /healthz { return 200 "ok\n"; }
    location /          { return 444; }
}

server {
    listen 443 ssl;
    server_name mock.ticketsales.test;

    ssl_certificate     /etc/nginx/tls/mock.crt;
    ssl_certificate_key /etc/nginx/tls/mock.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location = /healthz { return 200 "ok\n"; }
    location / {
        root /etc/nginx/html;
        try_files /mock-ticket.html =404;
    }
}
