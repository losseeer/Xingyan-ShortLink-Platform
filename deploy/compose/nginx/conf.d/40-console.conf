# M3-06 主办方看板（sl-console-web）的静态托管 + 同源反代（DESIGN 3.4 部署形态 / 7.2 可达性边界）
#
# 为什么单开一个 8081 而不是塞进 80：80 端口上 xy*.test 的 `/` 已经被数据面占了（短码就在根路径），
# 看板抢不到那个前缀。同 server_name、不同端口，是最省事的隔离办法。
#
# 为什么"同源"：浏览器只跟 8081 这一个 origin 说话，页面里的 fetch 走 `/api/v1/stats/...` 由这里转发，
# 于是既不需要 CORS，也不需要在浏览器里放任何密钥——stats 这条前缀本来就不经网关 HMAC（DESIGN 7.2）。
# 反代的是 consumer 的只读统计，不是管理面 API：那条要 HMAC，密钥不能进浏览器。

server {
    listen 8081;
    server_name xy1.test xy2.test xy3.test;

    root /etc/nginx/console;
    index index.html;

    # 只读统计：与 20-routes.conf 里同一条前缀保持同一 upstream 写法（变量 + Docker DNS 每 2s 重解析），
    # 这样 consumer 容器重启换 IP 时不必 reload nginx。
    location /api/v1/stats/ {
        set $stats_upstream consumer;
        proxy_pass http://$stats_upstream:8040;
    }
    # 看板不该碰到写侧与管理面：其余 /api/** 一律挡住，而不是"反正没密钥也用不了"。
    location /api/ { return 404; }

    # SPA：静态件带 hash 文件名可以久缓存；index.html 必须 no-store，
    # 否则发版后用户拿到的还是旧的 index.html 指着已经不存在的 hash。
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
