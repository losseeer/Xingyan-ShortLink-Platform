# M1-01 阶段先做可启动的 stub；M1-10 换为 /s/** → jump upstream(×2)、/api/** → admin
# 及 xy1/xy2/xy3.test 三 server_name（DESIGN 3.3 多域名）
server {
    listen 80 default_server;
    server_name _;

    location = /healthz {
        return 200 "ok\n";
    }

    location / {
        return 200 "xsl nginx stub - gateway routes come in M1-10\n";
    }
}
