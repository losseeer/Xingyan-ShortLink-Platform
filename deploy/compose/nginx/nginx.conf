user  nginx;
worker_processes  auto;

events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile      on;
    keepalive_timeout  65;

    # $upstream_addr / $upstream_status 是「nginx 轮询 jump×2」「kill 单实例后重试到另一实例」的实测凭证
    # rt = 客户端视角总耗时；uct/urt = nginx 与上游握手、上游应答两段——M2-00 用它归因 P99 尾巴
    log_format  route  '$host $request -> $upstream_addr [$status upstream=$upstream_status rt=$request_time '
                       'uct=$upstream_connect_time urt=$upstream_response_time] $http_user_agent';
    access_log  /var/log/nginx/access.log  route;
    error_log   /var/log/nginx/error.log   warn;

    include /etc/nginx/conf.d/*.conf;
}
