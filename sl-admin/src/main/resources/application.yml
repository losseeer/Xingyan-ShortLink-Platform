server:
  port: 8030

spring:
  application:
    name: sl-admin
  data:
    redis:
      host: ${XSL_REDIS_HOST:localhost}
      port: ${XSL_REDIS_PORT:6380}
  datasource:
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:classpath:sharding.yaml?placeholder-type=environment
  jackson:
    property-naming-strategy: SNAKE_CASE

xsl:
  pool:
    namespace: ${XSL_POOL_NS:0}
    capacity: ${XSL_POOL_CAPACITY:5000}
    refill-ratio: 0.2
  admission:
    # M1 白名单走配置注入（来源 xsl_base.domain_pool 的同步任务与人工审核队列留 M2）
    allowed-hosts: ${XSL_ALLOWED_HOSTS:mock.ticketsales.test,.xystage.test}
  link:
    base-domain: ${XSL_LINK_BASE_DOMAIN:xy1.test}
  quota-reconcile:
    # access_limit 的 Redis 权威值 → link_route.access_used 快照（DESIGN 8.4，M2-12）
    enabled: ${XSL_QUOTA_RECONCILE:true}
    interval-ms: ${XSL_QUOTA_RECONCILE_INTERVAL:60000}
    initial-delay-ms: ${XSL_QUOTA_RECONCILE_DELAY:20000}
    chunk: ${XSL_QUOTA_RECONCILE_CHUNK:500}
  outbox-sync:
    # outbox → link_route + 缓存的补偿（DESIGN 8.4，M3-02）。
    # enabled 只关定时那一半：POST /internal/outbox/replay 任何时候都能手动跑一轮。
    enabled: ${XSL_OUTBOX_SYNC:true}
    interval-ms: ${XSL_OUTBOX_SYNC_INTERVAL:5000}
    initial-delay-ms: ${XSL_OUTBOX_SYNC_DELAY:10000}
    batch: ${XSL_OUTBOX_SYNC_BATCH:500}
    max-retry: ${XSL_OUTBOX_SYNC_MAX_RETRY:10}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
