server:
  port: ${XSL_GATEWAY_PORT:8010}

spring:
  application:
    name: sl-gateway
  data:
    redis:
      host: ${XSL_REDIS_HOST:localhost}
      port: ${XSL_REDIS_PORT:6380}
  cloud:
    gateway:
      routes:
        - id: admin-api
          uri: http://${XSL_ADMIN_HOST:localhost}:${XSL_ADMIN_PORT:8030}
          predicates:
            - Path=/api/**
        # /s/** 不经这里：M1-10 由 nginx upstream 直连 jump×2（DESIGN 3.3 数据面不叠加管理面跳数，
        # 单机上每一次转发都是 P99 成本）。Sentinel 按 IP 限流落到 jump 侧实现。

xsl:
  auth:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
