server:
  port: 8020

spring:
  application:
    name: sl-jump
  data:
    redis:
      host: ${XSL_REDIS_HOST:localhost}
      port: ${XSL_REDIS_PORT:6380}
      # Lettuce 默认命令超时 60s、连接超时 10s：Redis 一挂，跳转就要在请求线程里等十几秒，
      # 8.3 的"降级"就变成"卡死"。压到 500ms——正常路径用不到，只有故障时才付出这一次等待。
      timeout: ${XSL_REDIS_TIMEOUT:500ms}
      connect-timeout: ${XSL_REDIS_CONNECT_TIMEOUT:500ms}
  datasource:
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:classpath:sharding.yaml?placeholder-type=environment
  jackson:
    property-naming-strategy: SNAKE_CASE
  kafka:
    bootstrap-servers: ${XSL_KAFKA_BOOTSTRAP:localhost:9094}
    producer:
      # M1 本机口径：短超时让故障快速转 WAL；acks=all + 重试由 M1-11 压测调参
      acks: all
      # M2-21 批量参数：点击事件 JSON 约 0.5–1KB，攒 64KB / 5ms 再发。
      # 这不会给跳转加延迟——send 是异步的（返回 future，由 sender 线程攒批），
      # 请求路径上唯一可能被卡住的点是 buffer.memory 满时的 max.block.ms（保持 1000ms）。
      batch-size: ${XSL_KAFKA_BATCH_SIZE:65536}
      buffer-memory: ${XSL_KAFKA_BUFFER_MEMORY:33554432}
      compression-type: ${XSL_KAFKA_COMPRESSION:lz4}
      properties:
        linger.ms: ${XSL_KAFKA_LINGER_MS:5}
        delivery.timeout.ms: 2000
        request.timeout.ms: 1500
        max.block.ms: 1000

xsl:
  jump:
    # 跳转形态（DESIGN 6.2「真开关」，M2-33 起是条件装配而不是注释）：
    #   dynamic（默认）= 按 route_json.rules 做一级决策，四类 target 各自决定 302 还是中间页；
    #   direct302      = 回退形态，永远 302 到 origin_url，任何请求都不返回 200 HTML。
    # 回退只需要改一个环境变量：XSL_JUMP_MODE=direct302。两个实现共用同一条决策链（频控/配额/事件顺序不变）。
    mode: ${XSL_JUMP_MODE:dynamic}
    # 小程序 URL Link 的生成方：本期只有 mock（返回确定性假链接，可被 UA 重放断言）。
    # 真实实现落地时提供另一个 UrlLinkProvider bean 并把这里改成 urllink。
    urllink:
      provider: ${XSL_JUMP_URLLINK_PROVIDER:mock}
    local-cache-size: ${XSL_JUMP_L1_SIZE:10000}
    local-cache-ttl-seconds: ${XSL_JUMP_L1_TTL:30}
    click-topic: ${XSL_CLICK_TOPIC:shortlink-click}
    wal-dir: ${XSL_JUMP_WAL_DIR:./data/jump-wal}
    wal-replay-ms: ${XSL_JUMP_WAL_REPLAY_MS:15000}
    ip-salt: ${XSL_IP_SALT:local-dev-salt}
    # Redis 键丢失时的冷重建缓冲（DESIGN 8.4「宁可少放不可超放」）：
    # 播种值 = access_limit − 快照已用 − 本缓冲，缓冲要盖住一个对账周期内没进快照的扣减量。
    access-rebuild-buffer: ${XSL_JUMP_CNT_REBUILD_BUFFER:100}
    # 频控（DESIGN 5.3 第 2 层）：链接可用 route_json.rate_limit_per_minute 覆盖全局阈值
    rate-limit:
      enabled: ${XSL_JUMP_RL_ENABLED:true}
      window-seconds: ${XSL_JUMP_RL_WINDOW:60}
      permits-per-window: ${XSL_JUMP_RL_PERMITS:60}
    # UA 特征表（M2-32，DESIGN 6.2）：按声明顺序取首个子串命中，全不中 → unknown。
    # key 是词汇表值（同时是 route 条件值与 click_event.device_type/os），必须落在枚举里，
    # 配错会在启动时抛异常；tokens 才是 UA 里的实际串（"月度更新"在单机的等价物就是改这里）。
    # 顺序是语义：wechat 要先于 qq（微信 UA 里也可能带 QQ 系串），ios/android 要先于 desktop
    #（Android UA 含 "linux"、iPad UA 含 "like mac os x"）。
    ua:
      containers:
        - key: wechat
          tokens: [micromessenger]
        - key: douyin
          tokens: [douyin, aweme]
        - key: qq
          tokens: ['qq/', mqqbrowser, qqbrowser]
        - key: weibo
          tokens: ['__weibo', weibo]
        - key: alipay
          tokens: [alipayclient]
      devices:
        - key: ios
          tokens: [iphone, ipad, ipod]
        - key: android
          tokens: [android]
        - key: desktop
          tokens: [windows nt, macintosh, x11, linux]

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      instance: ${XSL_INSTANCE:local}
    distribution:
      percentiles:
        # M2-00 诊断插桩：把"服务端处理耗时"与 wrk 的端到端时延分开看，
        # 才能判断 P99 的尾巴在 jump 里还是在链路（nginx/排队/同机争抢）上。
        http.server.requests: 0.5,0.95,0.99,0.999
