server:
  port: 8020

spring:
  application:
    name: sl-jump
  data:
    redis:
      host: ${XSL_REDIS_HOST:localhost}
      port: ${XSL_REDIS_PORT:6380}
      # Lettuce 默认命令超时 60s、连接超时 10s：Redis 一挂，跳转就要在请求线程里等十几秒，
      # 8.3 的"降级"就变成"卡死"。压到 500ms——正常路径用不到，只有故障时才付出这一次等待。
      timeout: ${XSL_REDIS_TIMEOUT:500ms}
      connect-timeout: ${XSL_REDIS_CONNECT_TIMEOUT:500ms}
  datasource:
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:classpath:sharding-jump.yaml?placeholder-type=environment
  jackson:
    property-naming-strategy: SNAKE_CASE
  kafka:
    bootstrap-servers: ${XSL_KAFKA_BOOTSTRAP:localhost:9094}
    producer:
      # M1 本机口径：短超时让故障快速转 WAL；acks=all + 重试由 M1-11 压测调参
      acks: all
      properties:
        delivery.timeout.ms: 2000
        request.timeout.ms: 1500
        max.block.ms: 1000

xsl:
  jump:
    # M1 纯 302（DESIGN 第十章开关）；动态路由匹配实现留 JumpResolver 接口扩展位
    mode: ${XSL_JUMP_MODE:direct302}
    local-cache-size: ${XSL_JUMP_L1_SIZE:10000}
    local-cache-ttl-seconds: ${XSL_JUMP_L1_TTL:30}
    click-topic: ${XSL_CLICK_TOPIC:shortlink-click}
    wal-dir: ${XSL_JUMP_WAL_DIR:./data/jump-wal}
    wal-replay-ms: ${XSL_JUMP_WAL_REPLAY_MS:15000}
    ip-salt: ${XSL_IP_SALT:local-dev-salt}
    # 频控（DESIGN 5.3 第 2 层）：链接可用 route_json.rate_limit_per_minute 覆盖全局阈值
    rate-limit:
      enabled: ${XSL_JUMP_RL_ENABLED:true}
      window-seconds: ${XSL_JUMP_RL_WINDOW:60}
      permits-per-window: ${XSL_JUMP_RL_PERMITS:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      instance: ${XSL_INSTANCE:local}
    distribution:
      percentiles:
        # M2-00 诊断插桩：把"服务端处理耗时"与 wrk 的端到端时延分开看，
        # 才能判断 P99 的尾巴在 jump 里还是在链路（nginx/排队/同机争抢）上。
        http.server.requests: 0.5,0.95,0.99,0.999
